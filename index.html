<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#071521"><title>TIDEBOUND</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071521;color:#fff;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;touch-action:none}canvas{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated}.hud{position:fixed;inset:0;pointer-events:none}.top{display:flex;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 8px) 9px}.p{background:#071018df;border:2px solid #d8e6d1;box-shadow:3px 3px #0008;padding:6px 8px;font-weight:800;font-size:11px}.q{position:absolute;left:9px;top:calc(env(safe-area-inset-top) + 57px);max-width:74%;font-size:10px}.dpad{position:fixed;left:13px;bottom:calc(env(safe-area-inset-bottom) + 12px);width:142px;height:142px}.dpad button{position:absolute;width:48px;height:48px;border:2px solid #d9e4d2;background:#263b3fdd;color:#fff;font-size:20px;border-radius:5px}.u{left:47px}.d{left:47px;top:94px}.l{top:47px}.r{top:47px;left:94px}.acts{position:fixed;right:10px;bottom:calc(env(safe-area-inset-bottom) + 12px);display:grid;grid-template-columns:62px 62px;gap:8px}.acts button,.m button{border:2px solid #e7f0da;background:#243c43;color:#fff;box-shadow:3px 3px #071018;border-radius:5px;font-family:inherit;font-weight:900;min-height:54px}.acts .a{background:#b34d3f}.acts .b{background:#4b6e8e}.mw{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:14px;z-index:20}.m{width:min(94vw,520px);max-height:82vh;overflow:auto;background:#13252c;border:4px solid #e5edda;box-shadow:7px 7px #000;padding:13px}.m h2{margin:0 0 8px;color:#f1d36b}.m p{font-size:12px;line-height:1.4}.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.it{border:1px solid #8ca09a;background:#1b343b;padding:7px;font-size:10px}.it b{display:block;color:#f1d36b}.it button{width:100%;min-height:34px;margin-top:5px}.close{width:100%;margin-top:10px;background:#743e3e!important}.start{position:fixed;inset:0;z-index:30;background:#081924;display:flex;align-items:center;justify-content:center;padding:20px}.card{width:min(92vw,500px);border:4px solid #e6eedc;background:#17313b;padding:20px;box-shadow:8px 8px #02070a}.logo{font-size:44px;letter-spacing:-4px;color:#f1d36b;text-shadow:3px 3px #8a3d35}.card p{font-size:12px;line-height:1.5}.card button{width:100%;height:58px;background:#b34d3f;color:#fff;border:3px solid #f5edd7;font:900 15px inherit}.toast{position:fixed;left:50%;bottom:175px;transform:translateX(-50%);background:#081017e8;border:2px solid #e7efdd;padding:7px 10px;font-size:11px;opacity:0;z-index:15;white-space:nowrap}</style></head><body><canvas id="g"></canvas><div class="hud"><div class="top"><div class="p">TIDEBOUND<br><span id="area">HOME ISLAND</span></div><div class="p">💰 <span id="money">0</span><br>⛽ <span id="fuel">0</span>/<span id="fuelmax">0</span> · 🎒 <span id="bag">0</span>/<span id="bagmax">8</span></div></div><div class="p q" id="quest"></div></div><div class="dpad"><button class="u" data-x="0" data-y="-1">▲</button><button class="l" data-x="-1" data-y="0">◀</button><button class="r" data-x="1" data-y="0">▶</button><button class="d" data-x="0" data-y="1">▼</button></div><div class="acts"><button class="b" id="inv">B<br><small>PACK</small></button><button class="a" id="act">A<br><small>ACTION</small></button></div><div class="toast" id="toast"></div><div class="mw" id="mw"><div class="m" id="modal"></div></div><div class="start" id="start"><div class="card"><div class="logo">TIDEBOUND</div><p>You arrive on a nearly abandoned island with a bamboo rod, an empty pocket and one buyer.</p><p>Fish. Sell. Upgrade. Rebuild the harbor. Buy a boat key. Cross deeper waters. Eventually descend into the Abyss Floors.</p><button id="go">BEGIN</button></div></div><script>const $=s=>document.querySelector(s),c=$('#g'),X=c.getContext('2d');let W,H,D=1;const TS=24,MW=32,MH=28;let cam={x:0,y:0},fishing=false,bite=0;const gear=['Bamboo Rod','Reed Rod','Oak Rod','Carbon Rod','Deepwater Rod','Abyss Rod','Pocket Knife','Fillet Knife','Sailor Knife','Titanium Knife','Abyssal Blade','Rusty Harpoon','Harpoon Gun','Speargun','Shock Spear','Flare Pistol','Net Launcher','Small Backpack','Canvas Pack','Deck Crate','Cold Box','Boat Key','Brass Key','Lighthouse Key','Vault Key','Fuel Can','Large Fuel Can','Emergency Fuel','Dinghy Hull','Coastal Hull','Offshore Hull','Ocean Cutter','Submarine Permit','Mini Submarine','Basic Sonar','Wide Sonar','Deep Sonar','Abyss Scanner','Small Engine','Twin Engine','Turbo Diesel','Silent Propeller','Crab Pot','Lobster Pot','Steel Trap','Deep Trap','Shovel','Lantern','Diving Mask','Wetsuit','Oxygen Tank','Pressure Suit','Lucky Hook','Silver Hook','Golden Hook','Pearl Charm','Map Fragment I','Map Fragment II','Map Fragment III','Ancient Chart','Repair Kit','Bait Box','Glow Bait','Mystery Bait'];const prices=[0,80,180,450,900,1800,45,130,280,650,1400,120,400,850,1600,300,700,90,220,500,950,350,600,900,1600,55,140,250,500,1200,2800,6000,8000,15000,700,1800,4500,9000,650,1800,4200,8500,160,360,800,1800,100,180,350,800,1600,4200,250,650,1800,3200,200,450,900,2200,120,70,240,600];const types=['rod','rod','rod','rod','rod','rod','knife','knife','knife','knife','knife','weapon','weapon','weapon','weapon','weapon','weapon','bag','bag','bag','bag','key','key','key','key','fuel','fuel','fuel','boat','boat','boat','boat','sub','sub','sonar','sonar','sonar','sonar','engine','engine','engine','engine','trap','trap','trap','trap','tool','tool','tool','tool','tool','tool','charm','charm','charm','charm','map','map','map','map','consumable','consumable','consumable','consumable'];const fish=[['Harbor Sardine',8,0],['Silver Herring',11,0],['Rock Goby',14,0],['Blue Mackerel',18,0],['Green Crab',20,0],['Sand Shrimp',22,0],['Red Snapper',32,1],['Sea Bass',38,1],['Moon Jelly',42,1],['Spider Crab',48,1],['Squid',55,1],['Moray Eel',70,1],['Tuna',95,2],['Swordfish',120,2],['King Crab',135,2],['Blue Lobster',150,2],['Mahi-Mahi',165,2],['Reef Octopus',180,2],['Marlin',240,3],['Black Grouper',260,3],['Giant Squid',320,3],['Hammerhead',380,3],['Sunfish',410,3],['Ghost Ray',460,3],['Lanternfish',550,4],['Viperfish',620,4],['Crystal Crab',700,4],['Glass Squid',780,4],['Gulper Eel',850,4],['Abyss Lobster',950,4],['Void Angler',1200,5],['Crown Jelly',1400,5],['Pale Shark',1650,5],['Titan Crab',1900,5],['Relic Coelacanth',2400,5],['The Old One',5000,6]];let S={x:14,y:17,map:'island',money:0,bag:[],owned:['Bamboo Rod'],bagCap:8,boat:0,fuel:0,fuelMax:0,store:false,workshop:false,sub:false,quest:0,caught:0};function resize(){D=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;X.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);function toast(t){let e=$('#toast');e.textContent=t;e.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.opacity=0,1100)}function hud(){money.textContent=S.money;fuel.textContent=Math.floor(S.fuel);fuelmax.textContent=S.fuelMax;bag.textContent=S.bag.length;bagmax.textContent=S.bagCap;area.textContent=S.map==='island'?'HOME ISLAND':S.map==='sea'?'OPEN SEA':'ABYSS FLOOR '+S.map.split('-')[1];let q=['Catch 3 harbor creatures and sell them to Silas.','Donate $500 to rebuild the General Store.','Buy the Boat Key.','Launch the dinghy and explore the reef.','Fund the Workshop and upgrade the boat.','Acquire the Mini Submarine.','Explore the Abyss Floors.'];quest.textContent='QUEST: '+q[Math.min(S.quest,6)]}function water(tx,ty){if(S.map==='sea')return true;if(S.map.startsWith('abyss'))return false;let dx=tx-16,dy=ty-14;return dx*dx/210+dy*dy/150>1}function solid(tx,ty){if(tx<0||ty<0||tx>=MW||ty>=MH)return true;if(S.map==='island'){if(water(tx,ty))return true;for(let b of [[6,6,6,5],[20,6,6,5],[22,17,5,4]])if(tx>=b[0]&&tx<b[0]+b[2]&&ty>=b[1]&&ty<b[1]+b[3])return true}return false}function tile(px,py,col){X.fillStyle=col;X.fillRect(px|0,py|0,TS+1,TS+1)}function text(t,x,y,col='#fff'){X.fillStyle='#071018';X.font='bold 11px monospace';X.fillText(t,x+1,y+1);X.fillStyle=col;X.fillText(t,x,y)}function building(tx,ty,w,h,roof,label){let x=tx*TS-cam.x,y=ty*TS-cam.y;X.fillStyle='#d6c49a';X.fillRect(x,y+TS,w*TS,h*TS-TS);X.fillStyle=roof;X.fillRect(x-4,y,w*TS+8,TS+8);X.fillStyle='#4b2f2b';X.fillRect(x+w*TS/2-10,y+h*TS-25,20,25);text(label,x+5,y+17)}function npc(x,y,name,col){let px=x*TS-cam.x,py=y*TS-cam.y;X.fillStyle=col;X.fillRect(px+6,py+7,12,15);X.fillStyle='#e7c9a5';X.fillRect(px+7,py,10,9);text(name,px-6,py-5,'#ffe27b')}function draw(){cam.x=Math.max(0,Math.min(MW*TS-W,S.x*TS-W/2));cam.y=Math.max(0,Math.min(MH*TS-H,S.y*TS-H/2));for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){let col=S.map==='sea'?((x+y)%3?'#176480':'#1b6d88'):S.map.startsWith('abyss')?((x+y)%2?'#172a39':'#2b2138'):water(x,y)?((x+y)%2?'#2b7591':'#317f9b'):((x*3+y)%5?'#70a85a':'#82b864');tile(x*TS-cam.x,y*TS-cam.y,col)}if(S.map==='island'){building(6,6,6,5,'#9d5845','GENERAL STORE');building(20,6,6,5,'#596b77','WORKSHOP');building(22,17,5,4,'#735340','LOCKED');X.fillStyle='#b78a55';X.fillRect(12*TS-cam.x,22*TS-cam.y,8*TS,2*TS);npc(15,13,'SILAS','#d4a04e');npc(10,10,'MIRA','#a15b72')}let px=S.x*TS-cam.x,py=S.y*TS-cam.y;if(S.map==='sea'){X.fillStyle='#8b553d';X.fillRect(px+1,py+8,22,12);X.fillStyle='#e6dfc7';X.fillRect(px+10,py-4,3,13);X.fillRect(px+13,py-2,8,7)}else{X.fillStyle='#18304a';X.fillRect(px+5,py+8,14,14);X.fillStyle='#e5bd91';X.fillRect(px+7,py+1,10,9);X.fillStyle='#b33e38';X.fillRect(px+5,py,14,4)}if(fishing){text(bite?'! BITE !':'FISHING...',W/2-34,H/2-65,'#ffe27b')}}function zone(){return S.map==='island'?0:S.map==='sea'?Math.min(4,Math.max(1,S.boat)):Math.min(6,4+Math.floor(+S.map.split('-')[1]/3))}function catchF(){let z=zone(),pool=fish.filter(f=>f[2]<=z&&f[2]>=Math.max(0,z-1)),f=pool[Math.floor(Math.random()*pool.length)];if(S.bag.length>=S.bagCap)return toast('Pack full');S.bag.push(f);S.caught++;fishing=false;bite=0;toast('Caught '+f[0]+' $'+f[1]);if(S.quest===0&&S.caught>=3)S.quest=1;hud()}function startFish(){if(S.bag.length>=S.bagCap)return toast('Pack full');fishing=true;bite=0;setTimeout(()=>{if(fishing){bite=1;toast('BITE! Tap A!')}},700+Math.random()*1400)}function action(){if(fishing)return bite?catchF():(fishing=false,toast('Too early'));if(S.map==='island'){if(Math.hypot(S.x-15,S.y-13)<2)return seller();if(Math.hypot(S.x-9,S.y-11)<3)return storeFn();if(Math.hypot(S.x-23,S.y-11)<3)return workshopFn();if(S.y>21&&S.x>11&&S.x<21){if(!S.owned.includes('Boat Key'))return toast('The boat is locked');S.map='sea';S.x=16;S.y=22;S.boat=Math.max(1,S.boat);S.fuel=S.fuelMax||60;S.quest=Math.max(3,S.quest);return hud()}return startFish()}if(S.map==='sea'){if(S.y>25){S.map='island';S.x=16;S.y=21;return hud()}if(S.sub&&S.x<5&&S.y<5){S.map='abyss-1';S.x=16;S.y=22;S.quest=6;return hud()}return startFish()}startFish()}function modal(h){$('#modal').innerHTML=h+'<button class="close" onclick="closeM()">CLOSE</button>';mw.style.display='flex'}function closeM(){mw.style.display='none'}function seller(){let total=S.bag.reduce((a,f)=>a+f[1],0),h='<h2>SILAS — BUYER</h2><p>Catch: '+S.bag.length+'<br>Offer: $'+total+'</p><button onclick="sellAll()">SELL EVERYTHING</button>';if(!S.store)h+='<p>Fund the old General Store.</p><button onclick="donate()">DONATE $500</button>';modal(h)}function sellAll(){let total=S.bag.reduce((a,f)=>a+f[1],0);S.money+=total;S.bag=[];closeM();toast('Sold for $'+total);hud()}function donate(){if(S.money<500)return toast('Need $500');S.money-=500;S.store=true;S.quest=Math.max(2,S.quest);closeM();toast('GENERAL STORE UNLOCKED');hud()}function storeFn(){if(!S.store)return modal('<h2>UNDER CONSTRUCTION</h2><p>Repairs needed: $500.</p>');shop('GENERAL STORE',['rod','knife','bag','key','fuel','trap','tool','consumable','charm','map'])}function workshopFn(){if(!S.workshop){if(S.money<1800)return modal('<h2>OLD WORKSHOP</h2><p>Reopening cost: $1800.</p>');return modal('<h2>OLD WORKSHOP</h2><button onclick="openWork()">FUND $1800</button>')}shop('HARBOR WORKSHOP',['boat','engine','sonar','sub','weapon'])}function openWork(){S.money-=1800;S.workshop=true;closeM();toast('WORKSHOP UNLOCKED');hud()}function shop(title,allowed){let h='<h2>'+title+'</h2><div class="grid">';gear.forEach((n,i)=>{if(allowed.includes(types[i]))h+='<div class="it"><b>'+n+'</b>'+types[i].toUpperCase()+'<br>$'+prices[i]+'<button '+(S.owned.includes(n)?'disabled':'')+' onclick="buy('+i+')">'+(S.owned.includes(n)?'OWNED':'BUY')+'</button></div>'});modal(h+'</div>')}function buy(i){if(S.money<prices[i])return toast('Not enough money');S.money-=prices[i];S.owned.push(gear[i]);if(types[i]==='bag')S.bagCap+=6;if(gear[i]==='Boat Key'){S.fuelMax=60;S.quest=Math.max(3,S.quest)}if(types[i]==='boat'){S.boat=Math.max(S.boat,Math.min(4,i-27));S.fuelMax=60+S.boat*45;S.quest=Math.max(4,S.quest)}if(gear[i]==='Mini Submarine'){S.sub=true;S.quest=5}if(types[i]==='fuel')S.fuel=Math.min(S.fuelMax,S.fuel+60);closeM();hud();toast('Bought '+gear[i])}function inventory(){let a=S.owned.map(n=>'<div class="it"><b>'+n+'</b></div>').join(''),b=S.bag.map(f=>'<div class="it"><b>'+f[0]+'</b>$'+f[1]+'</div>').join('');modal('<h2>PACK</h2><p>Gear '+S.owned.length+'/'+gear.length+'</p><div class="grid">'+a+'</div><p>Catch</p><div class="grid">'+(b||'<div class="it">Empty</div>')+'</div>')}function step(dx,dy){if(fishing)return;let nx=S.x+dx*.22,ny=S.y+dy*.22;if(S.map==='sea'){if(S.fuel<=0)return toast('OUT OF FUEL');S.fuel=Math.max(0,S.fuel-.12);S.x=Math.max(.5,Math.min(MW-1.5,nx));S.y=Math.max(.5,Math.min(MH-1.5,ny))}else if(!solid(Math.floor(nx),Math.floor(ny))){S.x=nx;S.y=ny}hud()}document.querySelectorAll('.dpad button').forEach(b=>{let dx=+b.dataset.x,dy=+b.dataset.y,id;const st=e=>{e.preventDefault();step(dx,dy);id=setInterval(()=>step(dx,dy),55)},en=()=>clearInterval(id);b.addEventListener('pointerdown',st);b.addEventListener('pointerup',en);b.addEventListener('pointercancel',en)});act.onclick=action;inv.onclick=inventory;go.onclick=()=>{start.style.display='none';hud();requestAnimationFrame(loop)};function loop(){draw();requestAnimationFrame(loop)}resize();hud();</script></body></html>
