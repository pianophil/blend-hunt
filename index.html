<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#0a0d11"><title>BLEND//HUNT</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0a0d11;color:#fff;font-family:-apple-system,Arial;touch-action:none}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}.top{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 10px) 12px;display:flex;justify-content:space-between;pointer-events:none}.box{background:#080a0dcc;border:1px solid #ffffff22;border-radius:15px;padding:8px 10px;font-weight:800;font-size:13px}.mission{position:fixed;top:90px;left:5%;width:90%;text-align:center;pointer-events:none;text-shadow:0 2px 12px #000}.mission b{display:block;font-size:29px}.controls{position:fixed;left:0;right:0;bottom:0;padding:10px 10px calc(env(safe-area-inset-bottom) + 10px);display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.controls button,#go{min-height:58px;border:1px solid #ffffff22;border-radius:17px;background:#171c23;color:#fff;font-weight:850;touch-action:manipulation}.controls strong{display:block;font-size:20px}.primary,#go{background:#eaff54!important;color:#111!important}.start{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 25%,#304038,#090b0d 70%);padding:20px}.card{width:min(92vw,480px);background:#0d1116ef;border:1px solid #ffffff20;border-radius:28px;padding:26px}.card h1{font-size:48px;line-height:.85;margin:0 0 15px}.card i{color:#eaff54;font-style:normal}.card p{line-height:1.4;color:#d7dbe1}.card button{width:100%;font-size:16px}.joy{position:fixed;width:116px;height:116px;border-radius:50%;border:1px solid #ffffff33;background:#0004;display:none;pointer-events:none;transform:translate(-50%,-50%)}.knob{position:absolute;width:50px;height:50px;border-radius:50%;left:33px;top:33px;background:#ffffffb8}</style></head><body><canvas id="g"></canvas><div class="top"><div class="box">BLEND//HUNT<br><small id="lvl">LEVEL 01</small></div><div class="box"><span id="ph">PREP</span> · <span id="tm">25</span>s<br><span id="xp">0</span> XP · ♥ <span id="life">3</span></div></div><div class="mission" id="msg"><b>VERSTECK DICH.</b><span>Farbe kopieren · Pose wählen · locken</span></div><div class="joy" id="joy"><div class="knob" id="knob"></div></div><div class="controls"><button id="paint"><strong>◉</strong>FARBE</button><button id="pose"><strong>⌁</strong>POSE</button><button id="lock" class="primary"><strong>◆</strong>LOCK</button><button id="dash"><strong>»</strong>DASH</button></div><div class="start" id="start"><div class="card"><h1>BLEND<i>//</i><br>HUNT</h1><p>Bewege deine Figur mit dem Finger. Kopiere die Farbe des Bodens, wähle eine Pose und friere dich ein, bevor die Hunter kommen.</p><p style="font-size:12px;opacity:.7">Für iPhone Safari und Chrome.</p><button id="go">SPIEL STARTEN</button></div></div><script>const $=s=>document.querySelector(s),c=$('#g'),x=c.getContext('2d');let W,H,D,last=0,phase='idle',timer=25,xp=0,lives=3,level=1,tiles=[],hunters=[],p,pose=0,locked=false,vx=0,vy=0,joy={},dash=0;const pals=[['#41533d','#536b4a','#74815d','#3c5550','#7a6851'],['#45515a','#64717a','#78685f','#4a5e67','#867b6b'],['#355462','#47798a','#69a0a3','#46566f','#6f8792']];const rnd=(a,b)=>a+Math.random()*(b-a),cl=(v,a,b)=>Math.max(a,Math.min(b,v));function rgb(h){let n=parseInt(h.slice(1),16);return[(n>>16)&255,(n>>8)&255,n&255]}function dif(a,b){let A=rgb(a),B=rgb(b);return Math.hypot(A[0]-B[0],A[1]-B[1],A[2]-B[2])/442}function tile(px,py){return tiles.find(t=>px>=t.x&&px<t.x+t.w&&py>=t.y&&py<t.y+t.h)||tiles[0]}function resize(){D=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0);if(phase!='idle')setup()}function setup(){let pal=pals[(level-1)%3],cw=W/5,ch=H/9;tiles=[];hunters=[];for(let y=0;y<9;y++)for(let q=0;q<5;q++)tiles.push({x:q*cw,y:y*ch,w:cw+1,h:ch+1,c:pal[(q+y*2)%5]});p={x:W*.5,y:H*.63,c:'#eeeeee'};for(let i=0;i<Math.min(3,1+level/2);i++)hunters.push({x:rnd(25,W-25),y:rnd(105,170),tx:rnd(20,W-20),ty:rnd(120,H-140),a:0,s:50+level*5,alert:0});$('#lvl').textContent='LEVEL '+String(level).padStart(2,'0')}function reset(){phase='prep';timer=25;locked=false;pose=0;vx=vy=0;setup();['paint','pose','lock','dash'].forEach(i=>$('#'+i).disabled=false);$('#msg').innerHTML='<b>VERSTECK DICH.</b><span>Farbe kopieren · Pose wählen · locken</span>'}function hunt(){phase='hunt';timer=20;locked=true;['paint','pose','lock','dash'].forEach(i=>$('#'+i).disabled=true);$('#msg').innerHTML='<b>NICHT BEWEGEN.</b><span>Die Hunter suchen dich.</span>'}function finish(ok,m){phase='result';if(ok){let g=300+level*75;xp+=g;$('#xp').textContent=xp;$('#msg').innerHTML='<b>ENTKOMMEN.</b><span>+'+g+' XP · '+m+'</span>'}else{lives--;$('#life').textContent=lives;$('#msg').innerHTML='<b>GEFUNDEN.</b><span>'+m+'</span>'}setTimeout(()=>{if(lives<=0){lives=3;xp=0;level=1;$('#life').textContent=3;$('#xp').textContent=0}else level++;reset()},1800)}function person(){x.save();x.translate(p.x,p.y);x.fillStyle=p.c;if(pose==0){x.beginPath();x.arc(0,-15,11,0,7);x.fill();x.fillRect(-9,-4,18,28);x.fillRect(-14,22,8,24);x.fillRect(6,22,8,24)}else if(pose==1){x.beginPath();x.arc(0,-9,10,0,7);x.fill();x.fillRect(-20,4,40,12);x.fillRect(-15,15,10,28);x.fillRect(5,15,10,28)}else if(pose==2){x.beginPath();x.arc(0,-7,10,0,7);x.fill();x.fillRect(-11,3,22,18);x.fillRect(-27,19,54,9)}else{x.beginPath();x.arc(0,-8,10,0,7);x.fill();x.rotate(-.55);x.fillRect(-7,0,14,38)}x.restore()}function draw(){for(const t of tiles){x.fillStyle=t.c;x.fillRect(t.x,t.y,t.w,t.h)}hunters.forEach(h=>{x.save();x.translate(h.x,h.y);x.rotate(h.a);x.fillStyle='#111';x.strokeStyle='#eaff54';x.lineWidth=2;x.beginPath();x.arc(0,0,12,0,7);x.fill();x.stroke();x.fillRect(-7,10,14,22);x.fillStyle='#eaff54';x.fillRect(8,-2,18,4);x.restore()});person();if(locked){x.strokeStyle='#eaff54';x.strokeRect(p.x-31,p.y-39,62,83)}if(phase=='prep'){let m=Math.round((1-dif(p.c,tile(p.x,p.y).c))*100);x.fillStyle='#080a0ccc';x.fillRect(12,H-178,133,32);x.fillStyle='#fff';x.font='800 12px Arial';x.fillText('TARNUNG '+m+'%',24,H-157)}}function update(dt){if(phase=='prep'){timer-=dt;dash=Math.max(0,dash-dt);if(!locked){p.x=cl(p.x+vx*dt,22,W-22);p.y=cl(p.y+vy*dt,105,H-125)}if(timer<=0)hunt()}else if(phase=='hunt'){timer-=dt;let mm=dif(p.c,tile(p.x,p.y).c);for(const h of hunters){let dx=h.tx-h.x,dy=h.ty-h.y,d=Math.hypot(dx,dy)||1;if(d<12){h.tx=rnd(20,W-20);h.ty=rnd(110,H-140)}else{h.x+=dx/d*h.s*dt;h.y+=dy/d*h.s*dt;h.a=Math.atan2(dy,dx)}let pd=Math.hypot(p.x-h.x,p.y-h.y);h.alert=Math.max(0,h.alert-dt*.45)+Math.max(0,1-pd/170)*(mm+.07)*dt*2.5;if(h.alert>1.05)return finish(false,Math.round(mm*100)+'% Farbabweichung')}if(timer<=0)finish(true,'Tarnung '+Math.round((1-mm)*100)+'%')}$('#ph').textContent=phase.toUpperCase();$('#tm').textContent=Math.max(0,Math.ceil(timer))}function loop(t){let dt=Math.min(.04,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}$('#paint').onclick=()=>{if(phase=='prep'&&!locked)p.c=tile(p.x,p.y).c};$('#pose').onclick=()=>{if(phase=='prep')pose=(pose+1)%4};$('#lock').onclick=()=>{if(phase=='prep')locked=!locked};$('#dash').onclick=()=>{if(phase!='prep'||locked||dash>0)return;dash=3;let l=Math.hypot(vx,vy)||1;p.x=cl(p.x+vx/l*85,22,W-22);p.y=cl(p.y+vy/l*85,105,H-125)};c.addEventListener('pointerdown',e=>{if(phase!='prep'||locked)return;joy={on:true,id:e.pointerId,cx:e.clientX,cy:e.clientY};$('#joy').style.display='block';$('#joy').style.left=e.clientX+'px';$('#joy').style.top=e.clientY+'px'});c.addEventListener('pointermove',e=>{if(!joy.on||joy.id!=e.pointerId)return;let dx=e.clientX-joy.cx,dy=e.clientY-joy.cy,l=Math.hypot(dx,dy),m=42;if(l>m){dx*=m/l;dy*=m/l}$('#knob').style.transform='translate('+dx+'px,'+dy+'px)';vx=dx/m*135;vy=dy/m*135});function end(){joy.on=false;vx=vy=0;$('#joy').style.display='none';$('#knob').style.transform='none'}c.addEventListener('pointerup',end);c.addEventListener('pointercancel',end);function start(e){e.preventDefault();$('#start').style.display='none';reset();last=performance.now();requestAnimationFrame(loop)}$('#go').addEventListener('click',start);$('#go').addEventListener('touchend',start,{passive:false});addEventListener('resize',resize);resize();</script></body></html>
