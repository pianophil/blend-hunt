<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>TIDEBOUND V6 CLEAN</title><style>*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071821;color:#fff;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;touch-action:none}canvas{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;background:#0a2530}button{font-family:inherit;touch-action:manipulation}#boot{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 50% 18%,#245967,#07131c 72%)}.card{width:min(92vw,520px);border:4px solid #edf1df;background:linear-gradient(#1a414a,#102730);padding:22px;box-shadow:9px 9px #02070a}.logo{font-size:48px;line-height:.88;letter-spacing:-4px;color:#f3d46d;text-shadow:3px 3px #873a31;margin-bottom:18px}.tag{font-size:11px;line-height:1.5;color:#d8e2dd}#begin{width:100%;height:64px;margin-top:15px;border:3px solid #fff2d5;background:linear-gradient(#d2604a,#9f3d31);color:#fff;font-weight:900;font-size:16px;box-shadow:4px 4px #02070a;border-radius:8px}.hud{position:fixed;inset:0;pointer-events:none}.top{display:flex;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 8px) 9px}.panel{background:#071722e8;border:2px solid #dce8d9;box-shadow:3px 3px #0009;padding:7px 9px;font-size:11px;font-weight:900}.quest{position:absolute;left:9px;top:calc(env(safe-area-inset-top) + 62px);font-size:10px}.joy{position:fixed;left:14px;bottom:calc(env(safe-area-inset-bottom) + 14px);width:140px;height:140px;border-radius:50%;background:#07131eba;border:3px solid #e7efdf99}.ring{position:absolute;inset:28px;border:2px dashed #ffffff2d;border-radius:50%}.knob{position:absolute;left:44px;top:44px;width:52px;height:52px;border-radius:50%;background:linear-gradient(#87a7ab,#415f68);border:3px solid #edf3e6}.buttons{position:fixed;right:10px;bottom:calc(env(safe-area-inset-bottom) + 14px);display:grid;grid-template-columns:66px 66px;gap:8px}.buttons button{border:2px solid #e7f0da;color:#fff;box-shadow:3px 3px #071018;border-radius:7px;font-weight:900;min-height:58px}#act{background:#b85140}#inv{background:#4b7197}.toast{position:fixed;left:50%;bottom:182px;transform:translateX(-50%);background:#061017f2;border:2px solid #e7efdd;padding:8px 11px;font-size:11px;opacity:0;z-index:80;white-space:nowrap}</style></head><body><canvas id="g"></canvas><div class="hud"><div class="top"><div class="panel">TIDEBOUND V6 CLEAN<br><span id="area">HOME ISLAND</span></div><div class="panel">💰 <span id="money">0</span><br>🎒 <span id="bag">0</span>/8</div></div><div class="panel quest" id="quest">QUEST: Catch 3 harbor creatures.</div></div><div class="joy" id="joy"><div class="ring"></div><div class="knob" id="knob"></div></div><div class="buttons"><button id="inv">B<br><small>PACK</small></button><button id="act">A<br><small>ACTION</small></button></div><div class="toast" id="toast"></div><div id="boot"><div class="card"><div class="logo">TIDEBOUND<br>V6 CLEAN</div><div class="tag">Standalone build. No iframe. No external game scripts. Direct iPhone start.</div><button id="begin" type="button">BEGIN</button></div></div><script>(()=>{'use strict';const E=id=>document.getElementById(id),C=E('g'),X=C.getContext('2d'),TS=24,MW=32,MH=28;let W=0,H=0,D=1,L=0,cam={x:0,y:0},face={x:0,y:1},started=false;const P={x:14,y:17,money:0,bag:[],caught:0};const J={on:false,id:null,x:0,y:0};const FISH=[{name:'Harbor Sardine',value:8},{name:'Silver Herring',value:11},{name:'Rock Goby',value:14},{name:'Blue Mackerel',value:18},{name:'Green Crab',value:20},{name:'Sand Shrimp',value:22}];function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function resize(){D=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;C.width=W*D;C.height=H*D;X.setTransform(D,0,0,D,0,0)}function water(x,y){let dx=x-16,dy=y-14;return dx*dx/210+dy*dy/150>1}function block(x,y){let r=.42;for(const p of [[x-r,y-r],[x+r,y-r],[x-r,y+r],[x+r,y+r]]){if(water(p[0],p[1]))return true;for(const b of [[6,6,6,5],[20,6,6,5],[22,17,5,4]])if(p[0]>=b[0]&&p[0]<b[0]+b[2]&&p[1]>=b[1]&&p[1]<b[1]+b[3])return true}return false}function px(x,y,w,h,c){X.fillStyle=c;X.fillRect(Math.round(x),Math.round(y),w,h)}function txt(t,x,y,c='#fff',z=11){X.font='900 '+z+'px monospace';X.fillStyle='#061018';X.fillText(t,x+1,y+1);X.fillStyle=c;X.fillText(t,x,y)}function tree(x,y){px(x+10,y+27,8,14,'#4b3428');px(x+2,y+12,28,18,'#1b4938');px(x,y+17,32,12,'#235d3e');px(x+5,y+7,24,17,'#39764c');px(x+10,y+2,16,15,'#5a9a5d');px(x+14,y,8,8,'#88c574')}function house(a,b,w,h,roof,label){let x=a*TS-cam.x,y=b*TS-cam.y,ww=w*TS,hh=h*TS;px(x,y+TS,ww,hh-TS,'#d6c49a');px(x-6,y,ww+12,35,roof);px(x+ww/2-12,y+hh-31,24,31,'#4a3028');px(x+18,y+42,20,17,'#8ec4d1');px(x+ww-38,y+42,20,17,'#8ec4d1');txt(label,x+6,y+18,'#fff',10)}function npc(tx,ty,name,col){let x=tx*TS-cam.x,y=ty*TS-cam.y,b=Math.sin(performance.now()/240+tx)*.8;px(x+4,y+27,24,5,'#0005');px(x+8,y+14+b,16,17,col);px(x+10,y+4+b,14,12,'#e7c9a5');px(x+9,y+2+b,16,5,name==='SILAS'?'#735239':'#4f3548');txt(name,x-5,y-5,'#ffe27b',10)}function player(){let x=P.x*TS-cam.x,y=P.y*TS-cam.y,t=performance.now(),m=J.on&&(Math.abs(J.x)+Math.abs(J.y)>.15),fr=m?Math.floor(t/110)%4:0,b=fr%2?-1:0,la=fr===1?2:fr===3?-1:0;px(x+3,y+31,28,5,'#0005');px(x+7+la,y+29+b,7,9,'#26343c');px(x+19-la,y+29+b,7,9,'#26343c');px(x+7,y+15+b,19,17,'#1b4261');px(x+9,y+18+b,15,6,'#32688a');px(x+10,y+4+b,14,12,'#e0b58a');px(x+8,y+1+b,19,6,'#a83833');px(x+22,y+2+b,7,3,'#f0cd64')}function world(t){cam.x=clamp(P.x*TS-W/2,0,MW*TS-W);cam.y=clamp(P.y*TS-H/2,0,MH*TS-H);for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){let sx=x*TS-cam.x,sy=y*TS-cam.y;if(water(x+.5,y+.5)){let q=Math.sin(t*.0027+x*.72+y*.31);px(sx,sy,TS+1,TS+1,q>.35?'#388da7':'#28778f');if((x+y+(t/500|0))%7===0)px(sx+4,sy+7,11,2,'#d8ffff38')}else{px(sx,sy,TS+1,TS+1,(x*3+y)%5?'#71a958':'#80b866')}}X.strokeStyle='#efd99b';X.lineWidth=4;X.globalAlpha=.75;X.beginPath();X.ellipse(16*TS-cam.x,14*TS-cam.y,Math.sqrt(210)*TS*.93,Math.sqrt(150)*TS*.93,0,0,Math.PI*2);X.stroke();X.globalAlpha=1;[[4,10],[5,14],[8,18],[24,13],[27,14],[19,4],[13,5],[4,16]].forEach(a=>tree(a[0]*TS-cam.x,a[1]*TS-cam.y));house(6,6,6,5,'#a45a43','GENERAL STORE');house(20,6,6,5,'#586d79','WORKSHOP');npc(15,13,'SILAS','#d4a04e');npc(10,10,'MIRA','#a15b72');player()}function toast(s){let e=E('toast');e.textContent=s;e.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.opacity=0,1100)}function hud(){E('money').textContent=P.money;E('bag').textContent=P.bag.length;E('quest').textContent='QUEST: Catch '+Math.min(3,P.caught)+'/3 harbor creatures.'}function shore(){return water(P.x+face.x*.9,P.y+face.y*.9)}function action(){if(Math.hypot(P.x-15,P.y-13)<2){if(!P.bag.length)return toast('Silas: Bring me a catch.');let total=P.bag.reduce((a,f)=>a+f.value,0);P.money+=total;P.bag=[];hud();return toast('Sold catch for $'+total)}if(!shore())return toast('Stand on land and face the water.');let f=FISH[Math.floor(Math.random()*FISH.length)];P.bag.push(f);P.caught++;hud();toast('Caught '+f.name+' · $'+f.value)}function update(dt){if(!J.on)return;let nx=P.x+J.x*3.2*dt,ny=P.y+J.y*3.2*dt;if(!block(nx,P.y))P.x=nx;if(!block(P.x,ny))P.y=ny;if(Math.abs(J.x)>Math.abs(J.y)&&Math.abs(J.x)>.15)face={x:Math.sign(J.x),y:0};else if(Math.abs(J.y)>.15)face={x:0,y:Math.sign(J.y)}}function loop(t){let dt=Math.min(.035,(t-L)/1000||0);L=t;update(dt);X.clearRect(0,0,W,H);world(t);requestAnimationFrame(loop)}const joy=E('joy'),knob=E('knob');joy.addEventListener('pointerdown',e=>{e.preventDefault();J.on=true;J.id=e.pointerId;joy.setPointerCapture?.(e.pointerId)});joy.addEventListener('pointermove',e=>{if(!J.on||e.pointerId!==J.id)return;let r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,l=Math.hypot(dx,dy),m=47;if(l>m){dx*=m/l;dy*=m/l}J.x=dx/m;J.y=dy/m;knob.style.transform='translate('+dx+'px,'+dy+'px)'});function end(){J.on=false;J.x=J.y=0;knob.style.transform='translate(0,0)'}joy.addEventListener('pointerup',end);joy.addEventListener('pointercancel',end);E('act').addEventListener('pointerup',e=>{e.preventDefault();action()});E('inv').addEventListener('pointerup',e=>{e.preventDefault();toast(P.bag.length?P.bag.map(f=>f.name).join(', '):'Pack empty')});function boot(e){if(e){e.preventDefault();e.stopPropagation()}if(started)return;started=true;E('boot').style.display='none';resize();hud();L=performance.now();requestAnimationFrame(loop)}const begin=E('begin');begin.addEventListener('pointerup',boot,{passive:false});begin.addEventListener('touchend',boot,{passive:false});begin.addEventListener('click',boot,{passive:false});addEventListener('resize',resize);document.addEventListener('contextmenu',e=>e.preventDefault(),{passive:false});document.addEventListener('selectstart',e=>e.preventDefault(),{passive:false});resize();hud()})();</script></body></html>
